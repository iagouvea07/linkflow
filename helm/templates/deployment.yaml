apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.labels.app }}
    spec:
      volumes:
      - name: migration-files
        configMap:
          name: {{ .Values.configMap.name }}
      initContainers:
      - name: wait-for-db
        image: busybox:latest
        envFrom:
        - secretRef:
            name: {{ .Values.secret.deployment.name }}
        command:
        - sh
        - -c 
        - until nc -vz $DB_HOST 3306; do sleep 2; done
      - name: linkflow-migration
        image: migrate/migrate
        envFrom:
        - secretRef:
            name: {{ .Values.secret.deployment.name }}
        command: 
        - sh
        - -c
        - migrate -path /migrations -database "mysql://${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:3306)/${DB_SCHEMA}" up
        volumeMounts:
        - name: migration-files
          mountPath: /migrations
      containers:
      - name: linkflow
        image: "{{ .Values.deployment.image.name }}:{{ .Values.deployment.image.version }}"
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: {{ .Values.secret.deployment.name }}
        resources:
          requests:
            memory: {{ .Values.deployment.resources.requests.memory }}
            cpu: {{ .Values.deployment.resources.requests.cpu }}
          limits:
            memory: {{ .Values.deployment.resources.limits.memory }}
            cpu: {{ .Values.deployment.resources.limits.cpu }}
        startupProbe:
          httpGet:
            path: {{ .Values.deployment.startupProbe.path }}
            port: 8000
          failureThreshold: {{ .Values.deployment.startupProbe.failureThreshold }}
          periodSeconds: {{ .Values.deployment.startupProbe.periodSeconds }}