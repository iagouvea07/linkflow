apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.statefulSet.db.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.statefulSet.db.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.statefulSet.db.labels.app }}
    spec:
      containers:
      - name: mysql
        image: "{{ .Values.statefulSet.db.image.name }}:{{ .Values.statefulSet.db.image.version }}"
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:
            name: {{ .Values.secret.statefulSet.name }}
        volumeMounts:
        - name: db-volume
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: db-volume
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.statefulSet.db.volumes.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.statefulSet.cache.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.statefulSet.cache.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.statefulSet.cache.labels.app }}
    spec:
      containers:
      - name: redis
        image: "{{ .Values.statefulSet.cache.image.name }}:{{ .Values.statefulSet.cache.image.version }}"
        ports:
        - containerPort: 6379